<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CM25114</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-sm rounded-xl shadow-lg p-6 border border-slate-200">
    <h3 class="text-xl font-bold text-slate-800 text-center mb-5">Grade Calculator</h3>

    <div class="space-y-4">
      <div>
        <label for="m1" class="block text-xs font-semibold text-slate-600 uppercase mb-1">
          Lab Experiment (Max 100)
        </label>
        <input 
          type="number" 
          id="m1" 
          min="0" 
          max="100" 
          placeholder="Enter marks"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div>
        <label for="m2" class="block text-xs font-semibold text-slate-600 uppercase mb-1">
          Viva Voce (Max 100)
        </label>
        <input 
          type="number" 
          id="m2" 
          min="0" 
          max="100" 
          placeholder="Enter marks"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>

      <div>
        <label for="m3" class="block text-xs font-semibold text-slate-600 uppercase mb-1">
          Lab Record (Max 100)
        </label>
        <input 
          type="number" 
          id="m3" 
          min="0" 
          max="100" 
          placeholder="Enter marks"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
        />
      </div>
    </div>

    <div id="errorMsg" class="hidden mt-3 text-xs text-red-600 text-center font-medium"></div>

    <div class="flex gap-2 mt-5">
      <button 
        type="button"
        onclick="calculate()" 
        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition shadow-sm"
      >
        Calculate
      </button>
      <button 
        type="button"
        onclick="resetForm()" 
        class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2 px-4 rounded-lg text-sm transition border border-slate-200"
      >
        Reset
      </button>
    </div>

    <div id="output" class="hidden mt-5 p-4 rounded-lg bg-slate-50 border border-slate-200 space-y-1.5 text-sm">
      <p class="text-slate-700 flex justify-between">
        <span>Total Marks:</span>
        <strong id="outTotal" class="text-slate-900">-</strong>
      </p>
      <p class="text-slate-700 flex justify-between">
        <span>Percentage:</span>
        <strong id="outPercentage" class="text-slate-900">-</strong>
      </p>
      <p class="text-slate-700 flex justify-between">
        <span>Grade:</span>
        <strong id="outGrade" class="text-slate-900">-</strong>
      </p>
      <p class="text-slate-700 flex justify-between pt-1 border-t border-slate-200">
        <span>Status:</span>
        <span id="outStatus" class="font-bold">-</span>
      </p>
    </div>
  </div>

  <script>
    function calculate() {
      const v1 = document.getElementById('m1').value.trim();
      const v2 = document.getElementById('m2').value.trim();
      const v3 = document.getElementById('m3').value.trim();

      const err = document.getElementById('errorMsg');
      const out = document.getElementById('output');

      // 1. Validation
      if (v1 === "" || v2 === "" || v3 === "") {
        err.innerText = "Please fill in all subject marks.";
        err.classList.remove('hidden');
        out.classList.add('hidden');
        return;
      }

      const s1 = Number(v1);
      const s2 = Number(v2);
      const s3 = Number(v3);

      if (s1 < 0 || s1 > 100 || s2 < 0 || s2 > 100 || s3 < 0 || s3 > 100) {
        err.innerText = "Marks must be between 0 and 100.";
        err.classList.remove('hidden');
        out.classList.add('hidden');
        return;
      }

      err.classList.add('hidden');

      // 2. Calculations
      const total = s1 + s2 + s3;
      const percentage = (total / 300) * 100;

      // 3. Grading Logic
      let grade = 'F';
      if (percentage >= 85) grade = 'A+';
      else if (percentage >= 75) grade = 'A';
      else if (percentage >= 60) grade = 'B';
      else if (percentage >= 45) grade = 'C';
      else if (percentage >= 35) grade = 'D';

      const isPassed = percentage >= 35 && s1 >= 35 && s2 >= 35 && s3 >= 35;

      // 4. Update UI
      document.getElementById('outTotal').innerText = `${total} / 300`;
      document.getElementById('outPercentage').innerText = `${percentage.toFixed(2)}%`;
      document.getElementById('outGrade').innerText = grade;

      const statusEl = document.getElementById('outStatus');
      statusEl.innerText = isPassed ? "PASS" : "FAIL";
      statusEl.className = isPassed ? "font-bold text-green-600" : "font-bold text-red-600";

      out.classList.remove('hidden');
    }

    function resetForm() {
      document.getElementById('m1').value = "";
      document.getElementById('m2').value = "";
      document.getElementById('m3').value = "";
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('output').classList.add('hidden');
    }
  </script>

</body>
</html>
