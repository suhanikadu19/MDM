<!DOCTYPE html>
<html lang="en">
    <head>

    <body class="bg-gray-100 min-h-screen p-6">
        <header class="bg-gradient-to-r from-blue-600 to indigo-600 text-whiye rounded-3xl p-6 sm:p-8 mb-6 shadow-xl">
            <div class ="flex flex-xols sm:flex-row justidy-between items-start sm:items-center gap-5">
                <div>
                    <div class="flex items-center gap-3">
                        <div clas="bg-white/20 p-3 rounded-2xl text-2xl"></div>
<div>
    <h1 class="text-2xl sm:text-4xl font-blod">
        Digital Invoice
    </h1>
    <p class="text-blue-100 mt-1">Proffessional Invoice Generator</p>
</div>
                    </div>
                </div>
            </div>
            <div class="bg-white/20 rounded-2xl p-4">

                    </p>
                </div>
                </div>

            </div>
        <div>
        <input type="text"
        placeholder="Businsee Name"

        <input type="email"
        placeholder="Business Email"
        class="w-full bg-white border border-blue-200 rounded-x p-3 mb-3 outline-none focus:ring-2 focus:ring-blue-400">
        <textarea rows="3" placeholder="Bussiness Address" class="w-full bg-white border border-blue-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-blue-400"></textarea>
