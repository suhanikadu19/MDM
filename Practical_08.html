<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Form</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md border border-slate-200">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-800">Student Registration</h2>
      <p class="text-sm text-slate-500 mt-1">College Admission Portal</p>
    </div>

    <form id="studentForm" onsubmit="return validateForm()" novalidate class="space-y-4">
      
      <!-- Full Name -->
      <div> 
        <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">Full Name <span class="text-red-500">*</span></label>
        <input 
          type="text" 
          id="fullName" 
          placeholder="e.g. John Doe" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
        <p id="nameError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Email Address -->
      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address <span class="text-red-500">*</span></label>
        <input 
          type="email" 
          id="email" 
          placeholder="john@example.com" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
        <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Mobile Number -->
      <div>
        <label for="mobile" class="block text-sm font-medium text-slate-700 mb-1">Mobile Number <span class="text-red-500">*</span></label>
        <input 
          type="tel" 
          id="mobile" 
          placeholder="10-digit mobile number" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
        <p id="mobileError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password <span class="text-red-500">*</span></label>
        <input 
          type="password" 
          id="password" 
          placeholder="Minimum 8 characters" 
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
        <p id="passwordError" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200 mt-2 shadow-sm">
        Submit Registration
      </button>
    </form>
  </div>

  <script>
    // Helper function to display error & highlight input
    function showError(inputId, errorId, message) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);
      
      error.innerText = message;
      error.classList.remove('hidden');
      
      // Tailwind error ring & border
      input.classList.remove('border-slate-300');
      input.classList.add('border-red-500', 'focus:ring-red-500');
    }

    // Helper function to clear previous error states
    function clearError(inputId, errorId) {
      const input = document.getElementById(inputId);
      const error = document.getElementById(errorId);

      error.innerText = '';
      error.classList.add('hidden');

      // Reset to default Tailwind styles
      input.classList.add('border-slate-300');
      input.classList.remove('border-red-500', 'focus:ring-red-500');
    }

    function validateForm() {
      // 1. Fetch values
      const name = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value;

      // 2. Clear old errors
      clearError("fullName", "nameError");
      clearError("email", "emailError");
      clearError("mobile", "mobileError");
      clearError("password", "passwordError");

      let isValid = true;

      // Validation 1: Mandatory Name
      if (name === "") {
        showError("fullName", "nameError", "Full name is required.");
        isValid = false;
      }

      // Validation 2: Email Format & Mandatory
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        showError("email", "emailError", "Email address is required.");
        isValid = false;
      } else if (!emailRegex.test(email)) {
        showError("email", "emailError", "Enter a valid email address (e.g. name@domain.com).");
        isValid = false;
      }

      // Validation 3: Mobile Number (10 digits)
      const mobileRegex = /^[0-9]{10}$/;
      if (mobile === "") {
        showError("mobile", "mobileError", "Mobile number is required.");
        isValid = false;
      } else if (!mobileRegex.test(mobile)) {
        showError("mobile", "mobileError", "Mobile number must be exactly 10 digits.");
        isValid = false;
      }

      // Validation 4: Password Length (min 8 chars)
      if (password === "") {
        showError("password", "passwordError", "Password is required.");
        isValid = false;
      } else if (password.length < 8) {
        showError("password", "passwordError", "Password must be at least 8 characters long.");
        isValid = false;
      }

      // If valid, submit form
      if (isValid) {
        alert("Registration successfully submitted!");
        return true;
      }

      return false; // Prevent form reload if validation fails
    }
  </script>

</body>
</html>
