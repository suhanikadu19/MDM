
<!DOCTYPE html>
<html lang="en" id="root">

<head>
    <meta charset="UTF-8">
    <title>Dark Mode with Tailwind CSS</title>
    <link rel="stylesheet" href="output.css">
    <script>
        function changeMode() {
            const root = document.getElementById('root');
            const btn = document.getElementById('select-mode');
            
            const isDark = root.classList.toggle('dark');
            btn.innerText = isDark ? "Apply Light Mode" : "Apply Dark Mode";
        }
    </script>
</head>

<body class="bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors">

    <button id="select-mode" 
            class="border border-slate-800 m-2 p-2 rounded hover:bg-slate-100 dark:border-slate-200 dark:bg-slate-900 dark:text-white" 
            onclick="changeMode()">
        Apply Dark Mode
    </button>

    <div class="p-4 bg-slate-100 dark:bg-slate-800">
        <h1 class="text-5xl font-bold dark:text-white">
            Dark Mode Test with Tailwind CSS
        </h1>
        <p class="text-2xl text-slate-600 dark:text-slate-300">
            Code Step By Step
        </p>
    </div>

    <div class="flex items-center m-10 border border-slate-700 p-3 dark:bg-slate-600 dark:border-red-600">
        <div class="bg-blue-300 size-12 dark:bg-black"></div>
        <p class="text-2xl ml-10 p-2 text-slate-900 dark:text-white">
            Box with Dark Mode
        </p>
    </div>

</body>
</html>
